          base64 -d /tmp/tomie-native/source.zip.b64 > /tmp/tomie-native/source.zip
          unzip -q /tmp/tomie-native/source.zip -d /tmp/tomie-native/src
          test -f /tmp/tomie-native/src/tomie_native_v01/app/build.gradle

      - name: Enable AndroidX
        shell: bash
        run: |
          cat > /tmp/tomie-native/src/tomie_native_v01/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Build native probe APK
        shell: bash
        run: |
          cd /tmp/tomie-native/src/tomie_native_v01
          gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          cp /tmp/tomie-native/src/tomie_native_v01/app/build/outputs/apk/debug/app-debug.apk TomieRunner-Native-v0.1-Probe.apk
          sha256sum TomieRunner-Native-v0.1-Probe.apk > TomieRunner-Native-v0.1-Probe.apk.sha256

      - name: Upload native probe APK
        uses: actions/upload-artifact@v4
        with:
          name: TomieRunner-Native-v0.1-Probe
          path: |
            TomieRunner-Native-v0.1-Probe.apk
            TomieRunner-Native-v0.1-Probe.apk.sha256
          if-no-files-found: error
          retention-days: 14
