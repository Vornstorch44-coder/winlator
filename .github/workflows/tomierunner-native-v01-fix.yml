name: Build TomieRunner Native 0.1 Probe Fix

on:
  push:
    branches:
      - tomierunner-0.3-build
    paths:
      - '.github/workflows/tomierunner-native-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore TomieRunner Native source
        shell: bash
        run: |
          rm -rf /tmp/tomie-native
          mkdir -p /tmp/tomie-native
          cat > /tmp/tomie-native/source.zip.b64 <<'TOMIE_NATIVE_SOURCE'
