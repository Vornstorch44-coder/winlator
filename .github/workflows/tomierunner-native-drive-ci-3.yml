name: TomieRunner Native Auto Build

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tomierunner-native-drive-ci.yml'

permissions:
  contents: read

env:
  TOMIE_SOURCE_DOC_ID: 1639IavW9KEHIlxah5JQD5hLAaicTA-tEgXzGFsawK0U

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch current Native source from Google Drive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tomie-native

          URL="https://docs.google.com/document/d/${TOMIE_SOURCE_DOC_ID}/export?format=txt"
          curl -fL --retry 3 "$URL" -o /tmp/tomie-native/source.b64

          python3 - <<'PY'
          from pathlib import Path
          import base64

          src = Path("/tmp/tomie-native/source.b64")
          dst = Path("/tmp/tomie-native/source.zip")

          text = src.read_text(encoding="utf-8-sig")
          clean = "".join(text.split())

          data = base64.b64decode(clean, validate=True)
          if data[:4] != b"PK\x03\x04":
              raise SystemExit("Decoded source is not a ZIP archive")

          dst.write_bytes(data)
          print(f"Decoded Native source: {len(data)} bytes")
          PY

          SHA="$(sha256sum /tmp/tomie-native/source.zip | awk '{print $1}')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          mkdir -p /tmp/tomie-native/src
          unzip -tq /tmp/tomie-native/source.zip
          unzip -q /tmp/tomie-native/source.zip -d /tmp/tomie-native/src

          SETTINGS="$(find /tmp/tomie-native/src -name settings.gradle -type f -print -quit)"
          test -n "$SETTINGS"

          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Source SHA-256: $SHA"

      - name: Check whether this source was already built
        id: built-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/tomie-native-built-marker
          key: tomie-native-built-${{ steps.source.outputs.sha }}

      - name: Build Native APK
        if: steps.built-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare APK artifact
        if: steps.built-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/tomie-native/out

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -type f -print -quit)"
          test -n "$APK"

          cp "$APK" /tmp/tomie-native/out/TomieRunner-Native-latest.apk
          sha256sum /tmp/tomie-native/out/TomieRunner-Native-latest.apk             > /tmp/tomie-native/out/TomieRunner-Native-latest.apk.sha256

          echo "${{ steps.source.outputs.sha }}" > /tmp/tomie-native-built-marker

      - name: Upload Native APK
        if: steps.built-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: TomieRunner-Native-${{ steps.source.outputs.sha }}
          path: /tmp/tomie-native/out/*
          if-no-files-found: error
          retention-days: 14

      - name: Remember built source
        if: steps.built-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: /tmp/tomie-native-built-marker
          key: tomie-native-built-${{ steps.source.outputs.sha }}
