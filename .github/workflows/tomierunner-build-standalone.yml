TOMIE_PATCH_B64
          base64 -d /tmp/TomieRunner_patch_v0_3.zip.b64 > /tmp/TomieRunner_patch_v0_3.zip
          unzip -q /tmp/TomieRunner_patch_v0_3.zip -d /tmp/tomie-patch
          PATCH_SCRIPT="$(find /tmp/tomie-patch -name apply_tomie_runner_patch.py -type f | head -n 1)"
          test -n "$PATCH_SCRIPT"
          python3 "$PATCH_SCRIPT" "$GITHUB_WORKSPACE/app"

      - name: Build APK
        shell: bash
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          cp app/app/build/outputs/apk/debug/app-debug.apk TomieRunner-v0.3.apk
          sha256sum TomieRunner-v0.3.apk > TomieRunner-v0.3.apk.sha256

      - name: Upload TomieRunner APK
        uses: actions/upload-artifact@v4
        with:
          name: TomieRunner-v0.3-APK
          path: |
            TomieRunner-v0.3.apk
            TomieRunner-v0.3.apk.sha256
          if-no-files-found: error
          retention-days: 14
