          TOMIE_PATCH_B64
          base64 -d /tmp/TomieRunner_patch_v0_4.zip.b64 > /tmp/TomieRunner_patch_v0_4.zip
          rm -rf /tmp/tomie-patch
          mkdir -p /tmp/tomie-patch
          unzip -q /tmp/TomieRunner_patch_v0_4.zip -d /tmp/tomie-patch
          PATCH_SCRIPT="$(find /tmp/tomie-patch -name 'apply_tomie_runner_patch_v04.py' -type f | head -n 1)"
