          python3 "$PATCH_SCRIPT" "$GITHUB_WORKSPACE/app"

      - name: Build APK
        shell: bash
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          cp app/app/build/outputs/apk/debug/app-debug.apk TomieRunner-v0.4.apk
          sha256sum TomieRunner-v0.4.apk > TomieRunner-v0.4.apk.sha256

      - name: Upload TomieRunner APK
        uses: actions/upload-artifact@v4
        with:
          name: TomieRunner-v0.4-APK
          path: |
            TomieRunner-v0.4.apk
            TomieRunner-v0.4.apk.sha256
          if-no-files-found: error
          retention-days: 14
