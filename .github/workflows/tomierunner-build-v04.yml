name: Build TomieRunner 0.4 APK

on:
  push:
    branches:
      - tomierunner-0.3-build
    paths:
      - '.github/workflows/tomierunner-build-v04.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Winlator fork and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;24.0.8215888' \
            'cmake;3.22.1'

